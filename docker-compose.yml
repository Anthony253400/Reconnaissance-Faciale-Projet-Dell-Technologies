version: '3.8'

services:
  # 1. Base de données vectorielle pour les visages
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # 2. Votre API d'intelligence artificielle (FastAPI)
  facial-recognition-app:
    build: .
    container_name: face_recognition_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - qdrant_host=qdrant
      - Qdrant_port=6333
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 3. Votre site Web PHP (Accessible directement par l'utilisateur)
  mon-site-web:
    image: php:8.2-apache
    container_name: site_web_php
    restart: always
    ports:
      - "80:80"  # Le port 80 est le port web standard (pas besoin de le taper dans l'URL)
    volumes:
      # Copie le dossier contenant votre index.php dans le répertoire web d'Apache
      - ./siteWeb:/var/www/html/
    depends_on:
      - facial-recognition-app