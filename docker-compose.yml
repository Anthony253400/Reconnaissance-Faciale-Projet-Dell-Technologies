x-env-base: &env-base
  qdrant_host: ${QDRANT_HOST}
  Qdrant_port: ${qdrant_PORT_http}
  NO_PROXY: ${NO_PROXY}
  INFERENCE_THREADS: ${INFERENCE_THREADS}

x-worker: &worker-base
  build: .
  image: face_recognition:latest
  restart: always
  environment:
    <<: *env-base

  command: >
    uvicorn siteWeb.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --loop uvloop
      --log-level warning
  expose:
    - "8000"
  depends_on:
    qdrant:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 15s
    timeout: 5s
    retries: 3

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "${qdrant_PORT_http}:6333"
      - "${qdrant_PORT_grpc}:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-gpu0:
    <<: *worker-base
    container_name: face_gpu0
    environment:
      <<: *env-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  worker-gpu1:
    <<: *worker-base
    container_name: face_gpu1
    environment:
     <<: *env-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  worker-gpu2:
    <<: *worker-base
    container_name: face_gpu2
    environment:
      <<: *env-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

  worker-gpu3:
    <<: *worker-base
    container_name: face_gpu3
    environment:
      <<: *env-base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]

  nginx:
    image: nginx:${nginx_VERSION}
    container_name: nginx_lb
    restart: always
    ports:
      - "${nginx_PORT}:8001"
    volumes:
      - ./nginx_lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - worker-gpu0

  site-web:
    image: php:${php_VERSION}
    container_name: site_web_php
    restart: always
    ports:
      - "${php_PORT}:80"
    volumes:
      - ./siteWeb:/var/www/html/
    depends_on:
      - nginx