version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  facial-recognition-app:
    build:
      context: .        # ← plus de network: host ni args ici
    container_name: face_recognition_api
    restart: always
    environment:
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - HTTP_PROXY=http://proxy.mtp.supportlabs.dell:80
      - HTTPS_PROXY=http://proxy.mtp.supportlabs.dell:80
      - NO_PROXY=localhost,127.0.0.1,qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      sh -c "
        CUDA_VISIBLE_DEVICES=0 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8001 &
        CUDA_VISIBLE_DEVICES=1 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8002 &
        CUDA_VISIBLE_DEVICES=2 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8003 &
        CUDA_VISIBLE_DEVICES=3 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8004 &
        wait
      "
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"

  mon-site-web:
    image: php:8.2-apache
    container_name: site_web_php
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./siteWeb:/var/www/html/
    depends_on:
      - facial-recognition-app