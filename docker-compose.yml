-worker: &worker-base
  build: .
  image: face_recognition:latest
  restart: always
  environment:
    - qdrant_host=qdrant
    - Qdrant_port=6333
    - NO_PROXY=localhost,127.0.0.1,qdrant
    - INFERENCE_THREADS=2
  command: >
    uvicorn siteWeb.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --loop uvloop
      --log-level warning
  expose:
    - "8000"
  depends_on:
    qdrant:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 15s
    timeout: 5s
    retries: 3

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-gpu0:
    <<: *worker-base
    container_name: face_gpu0
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
      - INFERENCE_THREADS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  worker-gpu1:
    <<: *worker-base
    container_name: face_gpu1
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
      - INFERENCE_THREADS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  worker-gpu2:
    <<: *worker-base
    container_name: face_gpu2
    environment:
      - CUDA_VISIBLE_DEVICES=2
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
      - INFERENCE_THREADS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

  worker-gpu3:
    <<: *worker-base
    container_name: face_gpu3
    environment:
      - CUDA_VISIBLE_DEVICES=3
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
      - INFERENCE_THREADS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]

  nginx:
    image: nginx:alpine
    container_name: nginx_lb
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./nginx_lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - worker-gpu0

  site-web:
    image: php:8.2-apache
    container_name: site_web_php
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./siteWeb:/var/www/html/
    depends_on:
      - nginx