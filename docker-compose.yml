version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  worker-gpu0:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: face_gpu0
    restart: always
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    command: uvicorn siteWeb.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"

  worker-gpu1:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: face_gpu1
    restart: always
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    command: uvicorn siteWeb.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"

  worker-gpu2:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: face_gpu2
    restart: always
    environment:
      - CUDA_VISIBLE_DEVICES=2
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    command: uvicorn siteWeb.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"

  worker-gpu3:
    build:
      context: .
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: face_gpu3
    restart: always
    environment:
      - CUDA_VISIBLE_DEVICES=3
      - qdrant_host=qdrant
      - Qdrant_port=6333
      - NO_PROXY=localhost,127.0.0.1,qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]
    command: uvicorn siteWeb.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: nginx_lb
    restart: always
    ports:
      - "8001:80"       # un seul port exposé vers l'extérieur
    volumes:
      - ./nginx_lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - worker-gpu0
      - worker-gpu1
      - worker-gpu2
      - worker-gpu3

  mon-site-web:
    image: php:8.2-apache
    container_name: site_web_php
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./siteWeb:/var/www/html/
    depends_on:
      - nginx