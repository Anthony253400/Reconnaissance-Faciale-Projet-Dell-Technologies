version: '3.8'

services:
  # 1. Base de données vectorielle pour les visages
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # 2. Votre API d'intelligence artificielle (FastAPI)

  facial-recognition-app:
    build:
      context: .
      network: host
    container_name: face_recognition_api
    restart: always
    args:
        - HTTP_PROXY=http://proxy.mtp.supportlabs.dell:80
        - HTTPS_PROXY=http://proxy.mtp.supportlabs.dell:80
        - NO_PROXY=localhost,127.0.0.1,qdrant
    environment:
      - qdrant_host=qdrant
      - Qdrant_port=6333
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 4 workers, chacun prend le GPU que CUDA_VISIBLE_DEVICES lui donne
    command: >
      sh -c "
        CUDA_VISIBLE_DEVICES=0 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8001 &
        CUDA_VISIBLE_DEVICES=1 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8002 &
        CUDA_VISIBLE_DEVICES=2 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8003 &
        CUDA_VISIBLE_DEVICES=3 uvicorn siteWeb.main:app --host 0.0.0.0 --port 8004 &
        wait
      "
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"

  # 3. Votre site Web PHP 
  mon-site-web:
    image: php:8.2-apache
    container_name: site_web_php
    restart: always
    ports:
      - "80:80"  # Le port 80 est le port web standard (pas besoin de le taper dans l'URL)
    volumes:
      # Copie le dossier contenant votre index.php dans le répertoire web d'Apache
      - ./siteWeb:/var/www/html/
    depends_on:
      - facial-recognition-app
