# nginx_lb.conf — Load balancer pour les 4 workers GPU
# =====================================================
# Chaque worker tourne sur son propre conteneur Docker,
# tous exposés en interne sur le port 8000.
# nginx écoute sur :80 (mappé sur :8001 côté hôte).
#
# WebSocket (/ws/) : sticky par IP pour éviter les déconnexions
# REST      (/add) : round-robin simple
# Santé           : /health retourne 200 si le worker répond

upstream inference_ws {
    # ip_hash garantit qu'une connexion WebSocket est toujours
    # redirigée vers le même worker pendant toute sa durée.
    ip_hash;
    server face_gpu0:8000;
    server face_gpu1:8000;
    server face_gpu2:8000;
    server face_gpu3:8000;
    keepalive 64;
}

upstream inference_rest {
    # least_conn distribue les gros uploads /add au worker le moins chargé.
    least_conn;
    server face_gpu0:8000;
    server face_gpu1:8000;
    server face_gpu2:8000;
    server face_gpu3:8000;
    keepalive 32;
}

server {
    listen 80;

    # ── WebSocket — détection temps réel ─────────────────────────────────────
    location /ws/ {
        proxy_pass         http://inference_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Timeouts généreux : une session de détection peut durer longtemps
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;
    }

    # ── REST — enregistrement d'une personne ─────────────────────────────────
    location /add {
        proxy_pass        http://inference_rest;
        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;
        client_max_body_size 100M;   # 50 frames JPEG ~= 5-10 Mo
        proxy_read_timeout  120s;
    }

    # ── Santé — vérification que le LB est vivant ─────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Tout le reste → erreur explicite ─────────────────────────────────────
    location / {
        return 404 "Not found — use /ws/detect or /add\n";
        add_header Content-Type text/plain;
    }
}