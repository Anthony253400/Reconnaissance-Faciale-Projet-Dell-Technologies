upstream inference {
    least_conn;                         # WebSocket collant : le moins chargé
    server worker-gpu0:8000;
    server worker-gpu1:8000;
    server worker-gpu2:8000;
    server worker-gpu3:8000;
    keepalive 64;
}

server {
    listen 80;

    # WebSocket /ws/detect et /ws/add
    location /ws/ {
        proxy_pass         http://inference;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # REST /add
    location /add {
        proxy_pass         http://inference;
        proxy_set_header   Host $host;
        client_max_body_size 200M;
    }
}