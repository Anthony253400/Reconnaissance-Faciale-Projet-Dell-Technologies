upstream inference {
    # least_conn = la connexion WebSocket va au worker le moins chargé
    least_conn;
    server facial-recognition-app:8001;
    server facial-recognition-app:8002;
    server facial-recognition-app:8003;
    server facial-recognition-app:8004;
    keepalive 64;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /add {
        proxy_pass http://inference;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    location /ws/ {
        proxy_pass http://inference;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /frame {
        proxy_pass http://inference;
        add_header Cache-Control "no-cache";
    }
}